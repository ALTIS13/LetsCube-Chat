services:
  kub-web:
    build:
      context: .
      dockerfile: docs/deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        VITE_AUTH_CAPTCHA_PROVIDER: ${VITE_AUTH_CAPTCHA_PROVIDER:-}
        VITE_AUTH_CAPTCHA_SITE_KEY: ${VITE_AUTH_CAPTCHA_SITE_KEY:-}
        VITE_AUTH_GATEWAY_URL: ${VITE_AUTH_GATEWAY_URL:-}
        VITE_CHAT_LIST_SUMMARIES_RPC_ENABLED: ${VITE_CHAT_LIST_SUMMARIES_RPC_ENABLED:-0}
        BASE_PATH: ${BASE_PATH:-/}
        PORT: ${PORT:-5173}
    ports:
      - "127.0.0.1:${KUB_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  kub-worker:
    build:
      context: .
      dockerfile: docs/deploy/Dockerfile
      target: api-runtime
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        VITE_AUTH_CAPTCHA_PROVIDER: ${VITE_AUTH_CAPTCHA_PROVIDER:-}
        VITE_AUTH_CAPTCHA_SITE_KEY: ${VITE_AUTH_CAPTCHA_SITE_KEY:-}
        VITE_AUTH_GATEWAY_URL: ${VITE_AUTH_GATEWAY_URL:-}
        VITE_CHAT_LIST_SUMMARIES_RPC_ENABLED: ${VITE_CHAT_LIST_SUMMARIES_RPC_ENABLED:-0}
        BASE_PATH: ${BASE_PATH:-/}
        PORT: ${PORT:-5173}
    environment:
      PORT: 8096
      SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SELFHOST_SERVICE_ROLE_KEY: ${SELFHOST_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@example.com}
      MEDIA_VARIANTS_WORKER_ENABLED: ${MEDIA_VARIANTS_WORKER_ENABLED:-1}
      MEDIA_VARIANTS_WORKER_TICK_MS: ${MEDIA_VARIANTS_WORKER_TICK_MS:-60000}
      REGISTRATION_CLEANUP_ENABLED: ${REGISTRATION_CLEANUP_ENABLED:-false}
      REGISTRATION_CLEANUP_REPORT_ONLY: ${REGISTRATION_CLEANUP_REPORT_ONLY:-true}
      REGISTRATION_CLEANUP_BATCH_SIZE: ${REGISTRATION_CLEANUP_BATCH_SIZE:-50}
      REGISTRATION_CLEANUP_INTERVAL_SECONDS: ${REGISTRATION_CLEANUP_INTERVAL_SECONDS:-3600}
    expose:
      - "8096"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8096/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # PocketFlow, the reference bot (artifacts/pocketflow/README.md).
  #
  # Deliberately holds no Supabase credential and no service role: it reaches
  # the messenger only through the public Bot API, exactly as an outside
  # developer’s application would. Its database is its own.
  #
  # Not started by default — `docker compose --profile pocketflow up` — because
  # it needs a bot token that only its owner has, and a service that fails to
  # start on every `compose up` is noise in everybody else’s logs.
  pocketflow:
    profiles: ["pocketflow"]
    build:
      context: .
      dockerfile: docs/deploy/Dockerfile
      target: pocketflow-runtime
    environment:
      PORT: 8099
      BOT_TOKEN: ${POCKETFLOW_BOT_TOKEN:?POCKETFLOW_BOT_TOKEN is required}
      BOT_API_BASE_URL: ${POCKETFLOW_BOT_API_BASE_URL:-https://api.letscube.ru}
      DATABASE_URL: ${POCKETFLOW_DATABASE_URL:?POCKETFLOW_DATABASE_URL is required}
      TRANSPORT: ${POCKETFLOW_TRANSPORT:-polling}
      PUBLIC_BASE_URL: ${POCKETFLOW_PUBLIC_BASE_URL:-}
      WEBHOOK_SECRET: ${POCKETFLOW_WEBHOOK_SECRET:-}
      DEVELOPER_IDS: ${POCKETFLOW_DEVELOPER_IDS:-}
      DEFAULT_TIME_ZONE: ${POCKETFLOW_DEFAULT_TIME_ZONE:-Europe/Moscow}
      LOG_LEVEL: ${POCKETFLOW_LOG_LEVEL:-info}
    expose:
      - "8099"
    healthcheck:
      # /healthz is liveness, not readiness: it deliberately does not touch
      # the database, so a brief Postgres blip cannot restart a process that
      # was about to recover.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8099/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
