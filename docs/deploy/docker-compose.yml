# Minimal docker-compose for self-hosting KUB.
# Run from this directory:
#   cp ../../.env.production.example .env
#   docker compose up -d --build
#
# IMPORTANT:
#   - All VITE_* values are baked into the bundle at build time.
#     Changing them requires `docker compose build`, not only restart.
#   - The web image must not receive SUPABASE_SERVICE_ROLE_KEY.

services:
  kub-web:
    build:
      context: ../..
      dockerfile: docs/deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
        VITE_AUTH_CAPTCHA_PROVIDER: ${VITE_AUTH_CAPTCHA_PROVIDER:-}
        VITE_AUTH_CAPTCHA_SITE_KEY: ${VITE_AUTH_CAPTCHA_SITE_KEY:-}
        BASE_PATH: ${BASE_PATH:-/}
    image: kub-web:latest
    container_name: kub-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KUB_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
