# nginx config for the КУБ static SPA.
# Used by both the Dockerfile and the bare-metal VPS deployment.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reasonable defaults
  charset utf-8;
  client_max_body_size 16m;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  # SPA fallback — every unknown path is served as index.html so wouter
  # can take over (`/tasks`, `/admin`, `/auth/callback`, ...).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed, immutable assets — cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Service Worker — must NEVER be cached, otherwise updates stick.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires off;
  }

  # PWA manifest — short cache.
  location = /manifest.json {
    add_header Cache-Control "public, max-age=300";
  }

  # Don't expose sourcemaps in prod by default.
  location ~ \.map$ {
    deny all;
    access_log off;
    log_not_found off;
  }
}
