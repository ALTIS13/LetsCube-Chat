# The one convenience redirect the Bot API runbook promises.
#
# `https://api.letscube.ru/bots/docs` is documented as a permanent redirect to
# the public page, which `letscube-web` serves. It has answered 404 for the
# whole life of the deployment (D-245): the labels for it are declared in
# `docs/deploy/docker-compose.coolify.yml`, and Coolify generates its own
# Compose from the application's settings, so a label written in a repository
# file never reaches the running container.
#
# It lives here rather than on a container because it belongs to no container:
# nothing is proxied, the request never reaches an application, and attaching
# it to the gateway would make the redirect disappear the next time the gateway
# is redeployed with regenerated labels — which is exactly how it was lost.
#
# Deployed by copying this file to `/data/coolify/proxy/dynamic/` on the host.
# Traefik's file provider there runs with `watch=true`, so it is picked up
# without restarting the proxy. Coolify writes its own files into that
# directory and marks them «generated by Coolify»; this one is ours and is
# named so it sorts away from theirs.
#
# Priority 210 beats the gateway's own priority-200 rule for
# `api.letscube.ru`, and both beat the priority -1000 catch-all that is
# currently answering — through the release catalogue's nginx, which is why the
# 404 arrives with `Server: nginx` and confuses the reader.

http:
  routers:
    letscube-bot-docs:
      entryPoints:
        - https
      rule: "Host(`api.letscube.ru`) && (Path(`/bots/docs`) || PathPrefix(`/bots/docs/`))"
      priority: 210
      middlewares:
        - letscube-bot-docs-redirect
      service: noop@file
      tls:
        certResolver: letsencrypt

  middlewares:
    letscube-bot-docs-redirect:
      redirectRegex:
        regex: "^https://api[.]letscube[.]ru/bots/docs(.*)"
        replacement: "https://app.letscube.ru/bots/docs${1}"
        permanent: true
