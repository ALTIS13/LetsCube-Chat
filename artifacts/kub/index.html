<!DOCTYPE html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#17212b" />
    <title>LETSCUBE</title>
    <meta name="description" content="LETSCUBE - мессенджер для киберарены, задач и рабочих чатов." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // LETSCUBE is installable as a PWA only on iPhone/iPad. Android and
      // Windows use dedicated packages and therefore do not receive a manifest.
      (function () {
        var ua = navigator.userAgent || "";
        var ios = /iPhone|iPod|iPad/i.test(ua)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!ios) return;
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "/manifest.json";
        document.head.appendChild(manifest);
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LETSCUBE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-hydration theme apply — keep in sync with THEME_INIT_SCRIPT in src/hooks/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("kub-theme");
          if (saved !== "system" && saved !== "dark" && saved !== "light") {
            var legacy = localStorage.getItem("kub:theme");
            saved = (legacy === "dark" || legacy === "light") ? legacy : "system";
          }
          var resolved = saved;
          if (saved === "system") {
            resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light";
          }
          var c = document.documentElement.classList;
          c.remove("dark"); c.remove("light");
          c.add(resolved);
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body class="antialiased h-full overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
