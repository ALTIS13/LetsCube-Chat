<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лицензии открытого ПО — LETSCUBE</title>
    <script>
      try {
        var theme = localStorage.getItem("kub-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <style>
      :root { color-scheme: light; --ground: #E9EFF6; --text: #07111F; --link: #1D4ED8; --rule: #BBC9D9; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { color-scheme: dark; --ground: #050B18; --text: #F5F7FB; --link: #A9CAFF; --rule: #344155; }
      }
      :root[data-theme="dark"] { color-scheme: dark; --ground: #050B18; --text: #F5F7FB; --link: #A9CAFF; --rule: #344155; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ground); color: var(--text); font: 16px/1.6 system-ui, sans-serif; letter-spacing: 0; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 24px 48px; overflow-wrap: anywhere; }
      header { margin-bottom: 32px; }
      header p { font-size: 18px; font-weight: 650; margin: 0 0 12px; }
      h1 { font-size: 28px; line-height: 1.25; margin: 0; }
      h2 { font-size: 20px; line-height: 1.4; margin: 0 0 16px; }
      section { border-top: 1px solid var(--rule); padding-top: 24px; }
      p { margin: 0 0 16px; }
      dl { margin: 24px 0 0; }
      dt { font-weight: 600; }
      dd { margin: 0 0 20px; }
      a { display: inline-block; min-height: 44px; padding: 8px 0; color: var(--link); text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>LETSCUBE</p>
        <h1>Лицензии открытого ПО</h1>
      </header>
      <section aria-labelledby="mediabunny-title">
        <h2 id="mediabunny-title">Mediabunny 1.56.1</h2>
        <p>Copyright (c) 2026-present, Vanilagy and contributors</p>
        <p>Исходный код Mediabunny распространяется по Mozilla Public License 2.0 (MPL-2.0).</p>
        <dl>
          <dt>Лицензия</dt>
          <dd><a href="licenses/MPL-2.0.txt">Полный текст MPL-2.0</a></dd>
          <dt>Исходный код используемой версии</dt>
          <dd><a href="https://github.com/Vanilagy/mediabunny/tree/v1.56.1" target="_blank" rel="noopener noreferrer">Исходный код Mediabunny 1.56.1</a></dd>
        </dl>
      </section>
    </main>
  </body>
</html>
