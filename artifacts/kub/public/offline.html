<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17212b" />
    <title>LETSCUBE offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #17212b;
        color: #f4f7fb;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(0, 209, 255, 0.16), transparent 32%),
          linear-gradient(135deg, #17212b 0%, #0d141d 100%);
      }

      main {
        width: min(100% - 32px, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 28px;
        background: rgba(23, 33, 43, 0.9);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .logo {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: rgba(0, 209, 255, 0.14);
        color: #00d1ff;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #aab6c5;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">LETSCUBE</div>
      <h1>Нет подключения</h1>
      <p>Проверьте сеть. Если приложение уже было открыто, вернитесь к нему после восстановления соединения.</p>
    </main>
  </body>
</html>
