<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ff00e6" />
    <meta name="robots" content="noindex,nofollow" />
    <title>LETSCUBE — проверка экрана</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #ff00e6; color: #101010; font: 16px/1.4 system-ui, sans-serif; }
      body { min-height: 100vh; }
      main { position: relative; z-index: 1; padding: max(20px, env(safe-area-inset-top, 0px)) 16px 0; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 10px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; padding: 8px; margin: 0 0 12px; }
      #control-target { min-height: 48px; padding: 8px 12px; border: 2px solid #101010; background: #fff; color: #101010; font: inherit; }
      #edge-target { position: absolute; top: calc(100vh - 120px); left: 0; right: 0; height: max(120px, 50vh); box-sizing: border-box; border: 2px solid #101010; background: #00ff70; touch-action: manipulation; }
      #vh-probe { position: absolute; visibility: hidden; pointer-events: none; height: 100vh; width: 0; }
      #dvh-probe { position: absolute; visibility: hidden; pointer-events: none; height: 100dvh; width: 0; }
      #fixed-probe { position: fixed; visibility: hidden; pointer-events: none; bottom: 0; height: 0; width: 0; }
      #safe-probe { position: absolute; visibility: hidden; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Проверка нижнего края</h1>
      <p>Только размеры экрана и последнее касание. Личные данные не читаются.</p>
      <pre id="viewport-metrics" aria-label="Размеры экрана">Загрузка…</pre>
      <p>Последнее касание: <output id="last-touch" aria-live="polite">none</output></p>
      <p>Координата: <output id="last-point">none</output></p>
      <button id="control-target" type="button">Контроль касания</button>
    </main>
    <div id="edge-target" role="button" aria-label="Нижний край" tabindex="0"></div>
    <div id="vh-probe" aria-hidden="true"></div>
    <div id="dvh-probe" aria-hidden="true"></div>
    <div id="fixed-probe" aria-hidden="true"></div>
    <div id="safe-probe" aria-hidden="true"></div>
    <script>
      const byId = (id) => document.getElementById(id);
      const number = (value) => Number.isFinite(value) ? Math.round(value) : "unavailable";
      const update = () => {
        const visual = window.visualViewport;
        const edge = byId("edge-target").getBoundingClientRect();
        const lines = [
          `screen.height=${number(screen.height)}`,
          `innerHeight=${number(window.innerHeight)}`,
          `document.clientHeight=${number(document.documentElement.clientHeight)}`,
          `document.scrollHeight=${number(document.documentElement.scrollHeight)}`,
          `scrollY=${number(window.scrollY)}`,
          `visualViewport.height=${number(visual?.height)}`,
          `visualViewport.offsetTop=${number(visual?.offsetTop)}`,
          `visualViewport.pageTop=${number(visual?.pageTop)}`,
          `visualViewport.scale=${visual?.scale ?? "unavailable"}`,
          `100vh=${number(byId("vh-probe").getBoundingClientRect().height)}`,
          `100dvh=${number(byId("dvh-probe").getBoundingClientRect().height)}`,
          `fixed.bottom=${number(byId("fixed-probe").getBoundingClientRect().bottom)}`,
          `safe.bottom=${getComputedStyle(byId("safe-probe")).paddingBottom}`,
          `edge.top=${number(edge.top)}`,
          `edge.bottom=${number(edge.bottom)}`,
          `navigator.standalone=${navigator.standalone === true}`,
          `display.standalone=${matchMedia("(display-mode: standalone)").matches}`,
        ];
        byId("viewport-metrics").textContent = lines.join("\n");
      };
      for (const [id, label] of [["control-target", "control"], ["edge-target", "edge"]]) {
        byId(id).addEventListener("pointerdown", (event) => {
          byId("last-touch").textContent = label;
          byId("last-point").textContent = `client=${number(event.clientX)},${number(event.clientY)} screen=${number(event.screenX)},${number(event.screenY)}`;
          update();
        });
      }
      update();
      window.addEventListener("resize", update);
      window.visualViewport?.addEventListener("resize", update);
      window.visualViewport?.addEventListener("scroll", update);
    </script>
  </body>
</html>
