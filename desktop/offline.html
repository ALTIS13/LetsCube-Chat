<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; navigate-to https://app.letscube.ru" />
    <title>LETSCUBE - нет подключения</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f5f7fa;
      }
      main { width: min(440px, calc(100% - 40px)); text-align: center; }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border: 1px solid #427fc2;
        background: #17212b;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 800;
        color: #ed1e7a;
      }
      h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: 0; }
      p { margin: 0 0 24px; color: #aab7c4; line-height: 1.5; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border: 1px solid #427fc2;
        border-radius: 6px;
        background: #427fc2;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #ed1e7a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">LC</div>
      <h1>Нет подключения к LETSCUBE</h1>
      <p>Проверьте интернет-соединение и доступность сервера, затем повторите попытку.</p>
      <a href="https://app.letscube.ru/">Повторить</a>
    </main>
  </body>
</html>
