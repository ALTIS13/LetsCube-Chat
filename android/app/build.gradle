apply plugin: 'com.android.application'

def versionProperties = new Properties()
versionProperties.load(new FileInputStream(rootProject.file('version.properties')))

def releaseSigningProjectPath = project.path
def releaseSigningEnvironmentNames = [
    'LETSCUBE_ANDROID_KEYSTORE_PATH',
    'LETSCUBE_ANDROID_KEY_ALIAS',
    'LETSCUBE_ANDROID_STORE_PASSWORD',
    'LETSCUBE_ANDROID_KEY_PASSWORD',
]
def releaseSigningEnvironment = releaseSigningEnvironmentNames.collectEntries { variableName ->
    [(variableName): System.getenv(variableName)]
}
def missingReleaseSigningVariable = releaseSigningEnvironmentNames.find { variableName ->
    !releaseSigningEnvironment[variableName]
}
def releaseKeystoreFile = missingReleaseSigningVariable ? null : file(releaseSigningEnvironment['LETSCUBE_ANDROID_KEYSTORE_PATH'])

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskResolved = taskGraph.allTasks.any { task ->
        task.project.path == releaseSigningProjectPath && task.name.toLowerCase().contains('release')
    }
    if (releaseTaskResolved) {
        if (missingReleaseSigningVariable) {
            throw new GradleException("Android release signing requires ${missingReleaseSigningVariable}.")
        }
        if (!releaseKeystoreFile.isFile()) {
            throw new GradleException('LETSCUBE_ANDROID_KEYSTORE_PATH must reference an existing regular file.')
        }
    }
}

android {
    namespace = "com.kub.messenger"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kub.messenger"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionProperties.getProperty("VERSION_CODE").toInteger()
        versionName versionProperties.getProperty("VERSION_NAME")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (!missingReleaseSigningVariable) {
                storeFile file(releaseSigningEnvironment['LETSCUBE_ANDROID_KEYSTORE_PATH'])
                keyAlias releaseSigningEnvironment['LETSCUBE_ANDROID_KEY_ALIAS']
                storePassword releaseSigningEnvironment['LETSCUBE_ANDROID_STORE_PASSWORD']
                keyPassword releaseSigningEnvironment['LETSCUBE_ANDROID_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
